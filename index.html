<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1220">
    <meta name="description" content="Abdo Store - منصة التجارة الإلكترونية في الجزائر">
    <title>Abdo Store | الجزائر</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #070b14;
            --bg-soft: #0d1422;
            --card: #111a2b;
            --card-2: #172235;
            --border: rgba(255,255,255,.09);
            --text: #f8fafc;
            --muted: #94a3b8;
            --shadow: 0 20px 60px rgba(0,0,0,.35);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: "Tajawal", "Cairo", Arial, sans-serif;
            background: radial-gradient(circle at top right, rgba(59,130,246,.13), transparent 30%),
                        radial-gradient(circle at bottom left, rgba(16,185,129,.08), transparent 30%),
                        var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        button, input, select, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .hidden {
            display: none !important;
        }

        .container {
            width: min(1200px, calc(100% - 30px));
            margin: auto;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(18px);
            background: rgba(7,11,20,.82);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            min-height: 74px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            font-size: 20px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            box-shadow: 0 10px 30px rgba(59,130,246,.25);
            font-size: 21px;
        }

        .brand small {
            display: block;
            color: var(--muted);
            font-size: 11px;
            font-weight: 500;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            border: 1px solid var(--border);
            background: rgba(255,255,255,.04);
            color: var(--text);
            padding: 10px 15px;
            border-radius: 12px;
            transition: .2s ease;
            font-weight: 700;
        }

        .btn:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,.08);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-color: transparent;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            border-color: transparent;
        }

        .btn-danger {
            background: rgba(239,68,68,.12);
            color: #fca5a5;
            border-color: rgba(239,68,68,.2);
        }

        .cart-button {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -6px;
            left: -6px;
            min-width: 21px;
            height: 21px;
            padding: 0 5px;
            display: grid;
            place-items: center;
            background: var(--danger);
            border-radius: 50px;
            font-size: 11px;
            font-weight: 900;
            border: 2px solid var(--bg);
        }

        .hero {
            padding: 70px 0 40px;
        }

        .hero-box {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 50px;
            background: linear-gradient(135deg, rgba(59,130,246,.17), rgba(124,58,237,.12)), var(--card);
            box-shadow: var(--shadow);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 12px;
            border-radius: 50px;
            background: rgba(59,130,246,.12);
            border: 1px solid rgba(59,130,246,.22);
            color: #93c5fd;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: clamp(32px, 6vw, 58px);
            line-height: 1.1;
            margin-bottom: 18px;
        }

        .gradient-text {
            background: linear-gradient(90deg, #60a5fa, #a78bfa, #34d399);
            -webkit-background-clip: text;
            color: transparent;
        }

        .hero p {
            color: var(--muted);
            max-width: 650px;
            font-size: 17px;
        }

        .hero-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 28px;
        }

        main {
            padding-bottom: 70px;
        }

        .store-toolbar {
            display: grid;
            grid-template-columns: 1fr 190px;
            gap: 12px;
            margin: 25px 0;
        }

        .search-box {
            position: relative;
        }

        .search-box span {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        .input, select, textarea {
            width: 100%;
            border: 1px solid var(--border);
            outline: none;
            background: var(--card);
            color: var(--text);
            border-radius: 13px;
            padding: 13px 15px;
            transition: .2s;
        }

        .search-box .input {
            padding-right: 45px;
        }

        select option {
            background: var(--card);
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin: 30px 0 18px;
        }

        .result-count {
            color: var(--muted);
            font-size: 14px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .product-card {
            overflow: hidden;
            position: relative;
            background: linear-gradient(180deg, var(--card), var(--bg-soft));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: .25s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59,130,246,.3);
            box-shadow: 0 18px 40px rgba(0,0,0,.25);
        }

        .product-image {
            height: 230px;
            position: relative;
            background: #0b1220;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .35s ease;
            cursor: zoom-in;
        }

        .product-card:hover .product-image img {
            transform: scale(1.04);
        }

        .product-body {
            padding: 16px;
        }

        .product-title {
            font-size: 17px;
            font-weight: 850;
            margin-bottom: 7px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 54px;
        }

        .vendor-name {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 13px;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .price {
            color: #34d399;
            font-size: 19px;
            font-weight: 950;
            white-space: nowrap;
        }

        .add-cart {
            flex: 1;
            padding: 10px;
            border-radius: 11px;
            border: 0;
            color: white;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        .gallery {
            display: flex;
            gap: 5px;
            padding: 7px;
            overflow-x: auto;
            background: #0b1220;
        }

        .gallery img {
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: .65;
        }

        .gallery img.active {
            opacity: 1;
            border-color: var(--primary);
        }

        .empty {
            text-align: center;
            padding: 70px 20px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            background: rgba(255,255,255,.02);
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: rgba(0,0,0,.72);
            backdrop-filter: blur(8px);
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: min(560px, 100%);
            max-height: 92vh;
            overflow-y: auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
        }

        .modal-header {
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(17,26,43,.94);
            border-bottom: 1px solid var(--border);
        }

        .close {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 10px;
            background: rgba(255,255,255,.06);
            color: white;
            font-size: 19px;
        }

        .modal-content {
            padding: 20px;
        }

        .auth-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 5px;
            background: var(--bg-soft);
            border-radius: 13px;
            margin-bottom: 18px;
        }

        .auth-switch button {
            border: 0;
            padding: 10px;
            border-radius: 9px;
            background: transparent;
            color: var(--muted);
            font-weight: 800;
        }

        .auth-switch button.active {
            background: var(--primary);
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
        }

        .role-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .role-option {
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 12px;
            background: var(--bg-soft);
            cursor: pointer;
        }

        .toast-container {
            position: fixed;
            left: 18px;
            bottom: 18px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .toast {
            min-width: 260px;
            max-width: 360px;
            padding: 13px 15px;
            border-radius: 13px;
            background: #111827;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            font-size: 14px;
        }

        .loading {
            min-height: 200px;
            display: grid;
            place-items: center;
            color: var(--muted);
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 3px solid rgba(255,255,255,.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<header>
    <div class="container header-inner">
        <a href="#" class="brand">
            <span class="brand-icon">📦</span>
            <span>
                Abdo Store
                <small>منصة التجارة الإلكترونية 🇩🇿</small>
            </span>
        </a>

        <nav class="nav">
            <button class="btn cart-button" id="cartBtn">
                🛒 السلة
                <span class="cart-count hidden" id="cartCount">0</span>
            </button>
            <button class="btn hidden" id="adminBtn">🏪 لوحة البائع</button>
            <button class="btn" id="loginBtn">🔐 الدخول</button>
            <button class="btn btn-danger hidden" id="logoutBtn">خروج</button>
        </nav>
    </div>
</header>

<section class="hero">
    <div class="container">
        <div class="hero-box">
            <div class="hero-content">
                <span class="badge">🇩🇿 متجر جزائري • سريع • بسيط</span>
                <h1>مرحبًا بك في <span class="gradient-text">Abdo Store</span></h1>
                <p>اكتشف المنتجات، أضفها إلى سلتك، وأرسل طلبك مباشرة عبر WhatsApp.</p>
                <div class="hero-actions">
                    <button class="btn btn-primary" id="startShopping">🛍️ ابدأ التسوق</button>
                    <button class="btn" id="heroLogin">🔐 تسجيل الدخول</button>
                </div>
            </div>
        </div>
    </div>
</section>

<main>
    <div class="container">
        <section id="storeSection">
            <div class="section-title">
                <div>
                    <h2>🛍️ المنتجات</h2>
                    <span class="result-count" id="resultCount">جاري التحميل...</span>
                </div>
            </div>

            <div class="store-toolbar">
                <div class="search-box">
                    <span>🔎</span>
                    <input class="input" id="searchInput" type="search" placeholder="ابحث عن منتج...">
                </div>
                <select id="sortSelect">
                    <option value="newest">الأحدث</option>
                    <option value="price-low">السعر: من الأقل</option>
                    <option value="price-high">السعر: من الأعلى</option>
                    <option value="name">الاسم</option>
                </select>
            </div>

            <div id="productsContainer">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </section>
    </div>
</main>

<footer>
    <div class="container" style="text-align:center; padding:20px; color:var(--muted); font-size:13px;">
        © 2026 Abdo Store — صنع بـ ❤️ في الجزائر 🇩🇿
    </div>
</footer>

<div class="modal" id="authModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>🔐 الحساب</h3>
            <button class="close" data-close="authModal">×</button>
        </div>
        <div class="modal-content">
            <div class="auth-switch">
                <button id="loginTab" class="active">تسجيل الدخول</button>
                <button id="signupTab">إنشاء حساب</button>
            </div>
            <form id="authForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input class="input" id="authEmail" type="email" required placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input class="input" id="authPassword" type="password" required minlength="6" placeholder="••••••••">
                </div>
                <div class="form-group hidden" id="roleGroup">
                    <label>نوع الحساب</label>
                    <div class="role-options">
                        <label class="role-option"><input type="radio" name="role" value="customer" checked> 👤 عميل</label>
                        <label class="role-option"><input type="radio" name="role" value="vendor"> 🏪 بائع</label>
                    </div>
                </div>
                <button class="btn btn-primary" id="authSubmit" type="submit" style="width:100%;">دخول</button>
            </form>
            <p class="form-note" id="authMessage" style="margin-top:10px; color:var(--danger); font-size:13px;"></p>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
"use strict";

const SUPABASE_URL = "https://lvthnzfubbrhyfnwqaxs.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2dGhuemZ1YmJyaHlmbndxYXhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzg3MjYsImV4cCI6MjA1NjgxNDcyNn0.2X2JtX7e1P6qYw5S8t3V9u4L1z0K6m2N8x3F5b7C9vA";

const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const state = {
    products: [],
    currentUser: null,
    role: "customer",
    authMode: "login"
};

const $ = s => document.querySelector(s);

function toast(message, type = "success") {
    const item = document.createElement("div");
    item.className = `toast ${type}`;
    item.textContent = message;
    $("#toastContainer").appendChild(item);
    setTimeout(() => item.remove(), 3500);
}

function showModal(m) { if(m) m.classList.add("show"); }
function closeModal(m) { if(m) m.classList.remove("show"); }

document.querySelectorAll("[data-close]").forEach(btn => {
    btn.addEventListener("click", () => closeModal($(`#${btn.dataset.close}`)));
});

$("#loginBtn").addEventListener("click", () => showModal($("#authModal")));
$("#heroLogin").addEventListener("click", () => showModal($("#authModal")));

$("#loginTab").addEventListener("click", () => {
    state.authMode = "login";
    $("#loginTab").classList.add("active");
    $("#signupTab").classList.remove("active");
    $("#roleGroup").classList.add("hidden");
    $("#authSubmit").textContent = "تسجيل الدخول";
});

$("#signupTab").addEventListener("click", () => {
    state.authMode = "signup";
    $("#signupTab").classList.add("active");
    $("#loginTab").classList.remove("active");
    $("#roleGroup").classList.remove("hidden");
    $("#authSubmit").textContent = "إنشاء الحساب";
});

async function fetchProducts() {
    if (!supabaseClient) return;
    try {
        const { data, error } = await supabaseClient.from("market_products").select("*").order("created_at", { ascending: false });
        if (error) throw error;
        state.products = data || [];
        renderProducts();
    } catch (err) {
        console.error(err);
        $("#productsContainer").innerHTML = `<div class="empty"><h3>تعذر تحميل المنتجات</h3><p>تحقق من جدول market_products في Supabase.</p></div>`;
    }
}

function renderProducts() {
    const container = $("#productsContainer");
    if (!state.products.length) {
        container.innerHTML = `<div class="empty"><h3>لا توجد منتجات حالياً</h3></div>`;
        $("#resultCount").textContent = "0 منتج";
        return;
    }
    
    $("#resultCount").textContent = `${state.products.length} منتج`;
    container.innerHTML = `<div class="products-grid" id="grid"></div>`;
    const grid = $("#grid");

    state.products.forEach(p => {
        let imgs = Array.isArray(p.images) ? p.images : [p.images || "https://placehold.co/400x300"];
        grid.innerHTML += `
            <article class="product-card">
                <div class="product-image"><img src="${imgs[0]}" alt="${p.title}"></div>
                <div class="product-body">
                    <h3 class="product-title">${p.title}</h3>
                    <div class="vendor-name">${p.vendor || 'متجر'}</div>
                    <div class="product-footer">
                        <span class="price">${p.price} دج</span>
                        <button class="add-cart" onclick="toast('تمت الإضافة للسلة')">أضف للسلة</button>
                    </div>
                </div>
            </article>
        `;
    });
}

document.addEventListener("DOMContentLoaded", () => {
    fetchProducts();
});
</script>

</body>
</html>
