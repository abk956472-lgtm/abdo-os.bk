<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Abdo OS Pro</title>
    <style>
        body { margin: 0; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        input { padding: 15px; border-radius: 10px; border: none; margin: 10px; width: 80%; max-width: 300px; text-align: center; }
        button { padding: 15px 30px; background: #00d4ff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 5px; }
        .drawer { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px; }
        .app-item { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .app-item:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        .icon { font-size: 40px; margin-bottom: 10px; }
        #status { margin-top: 20px; color: #00d4ff; font-size: 20px; }
    </style>
</head>
<body>

    <div id="lockScreen">
        <h2>🔒 قفل النظام</h2>
        <input type="password" id="pass" placeholder="كلمة المرور: 123">
        <button onclick="checkPass()">دخول</button>
    </div>

    <div id="mainContent" style="display:none; text-align:center;">
        <h1>Abdo AI Pro</h1>
        <button id="mic" onclick="startAI()">تحدث مع المساعد 🎙️</button>
        <p id="status">اضغط للتحدث...</p>
        
        <div class="drawer">
            <div class="app-item" onclick="window.open('https://google.com')">
                <div class="icon">🌐</div>
                <div>جوجل</div>
            </div>
            <div class="app-item" onclick="window.location.reload()">
                <div class="icon">🔄</div>
                <div>إعادة تحميل</div>
            </div>
        </div>
    </div>

    <script>
        function checkPass() {
            if(document.getElementById('pass').value == "123") {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            } else { alert("كلمة المرور خطأ!"); }
        }

        function startAI() {
            const status = document.getElementById('status');
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'ar-DZ';
            recognition.start();
            status.innerText = "أنا أسمعك يا عبده...";
            
            recognition.onresult = (e) => {
                const cmd = e.results[0][0].transcript.toLowerCase();
                status.innerText = "أنت قلت: " + cmd;
                if(cmd.includes('افتح جوجل')) { window.open('https://google.com', '_blank'); }
            };
        }
    </script>
</body>
</html>
