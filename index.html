<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdo Store - منصة التجار الجزائرية</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        /* Navbar */
        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .nav-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .btn-admin {
            background-color: var(--warning-color);
        }

        .btn-logout {
            background-color: var(--danger-color);
        }

        .cart-badge {
            background-color: var(--danger-color);
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.75rem;
            margin-right: 4px;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 1.4rem;
            border-right: 4px solid var(--primary-color);
            padding-right: 10px;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #334155;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .store-owner-tag {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .product-price {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 12px;
        }

        .add-to-cart-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            float: left;
            font-size: 1.5rem;
            cursor: pointer;
            color: #94a3b8;
        }

        .cart-item, .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }

        .form-group {
            margin-top: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        .delete-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .switch-auth {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #94a3b8;
            cursor: pointer;
        }
        .switch-auth span {
            color: var(--primary-color);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📦 Abdo Store</div>
        <div class="nav-btns" id="navBtnsContainer">
            <!-- الزر ديناميكي حسب حالة التاجر -->
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">جميع المنتجات المتوفرة</h2>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- نافذة سلة التسوق -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('cartModal')">&times;</span>
            <h3>🛒 سلة التسوق</h3>
            <div id="cartItemsList" style="margin-top: 15px;"></div>
            <h4 style="margin-top: 15px; text-align: left;">المجموع: <span id="totalPrice" style="color: var(--accent-color);">0</span> دج</h4>
            <hr style="margin: 20px 0; border-color: #334155;">
            <h3>📋 معلومات التوصيل (الدفع عند الاستلام)</h3>
            <form id="orderForm" onsubmit="sendOrder(event)">
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" id="custName" required placeholder="مثال: محمد أمين">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="tel" id="custPhone" required placeholder="06XXXXXXXX">
                </div>
                <div class="form-group">
                    <label>الولاية:</label>
                    <select id="custWilaya" required>
                        <option value="">اختر الولاية...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>البلدية / العنوان:</label>
                    <input type="text" id="custAddress" required placeholder="اسم البلدية أو الحي">
                </div>
                <button type="submit" class="submit-btn">📲 تأكيد الطلب عبر واتساب</button>
            </form>
        </div>
    </div>

    <!-- نافذة تسجيل الدخول / إنشاء حساب للتاجر -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('authModal')">&times;</span>
            <div id="loginSection">
                <h3 id="authTitle">🔐 تسجيل دخول التاجر</h3>
                <form onsubmit="handleLogin(event)" style="margin-top: 15px;">
                    <div class="form-group">
                        <label>اسم المستخدم (التاجر):</label>
                        <input type="text" id="loginUser" required placeholder="اسمك التجاري">
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور:</label>
                        <input type="password" id="loginPass" required placeholder="كلمة المرور">
                    </div>
                    <button type="submit" class="submit-btn">دخول إلى لوحة التحكم</button>
                </form>
                <div class="switch-auth" onclick="toggleAuthMode()">ليس لديك حساب؟ <span>أنشئ حساباً جديداً</span></div>
            </div>

            <div id="registerSection" style="display: none;">
                <h3>📝 إنشاء حساب تاجر جديد</h3>
                <form onsubmit="handleRegister(event)" style="margin-top: 15px;">
                    <div class="form-group">
                        <label>اسم المتجر / التاجر:</label>
                        <input type="text" id="regUser" required placeholder="مثال: متجر الأنيق للملابس">
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف (لتلقي الطلب):</label>
                        <input type="tel" id="regPhone" required placeholder="2136xxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور:</label>
                        <input type="password" id="regPass" required placeholder="كلمة مرور قوية">
                    </div>
                    <button type="submit" class="submit-btn" style="background-color: var(--primary-color);">تسجيل حساب جديد</button>
                </form>
                <div class="switch-auth" onclick="toggleAuthMode()">لديك حساب بالفعل؟ <span>تسجيل الدخول</span></div>
            </div>
        </div>
    </div>

    <!-- لوحة تحكم التاجر الخاصة -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('adminModal')">&times;</span>
            <h3>⚙️ لوحة تحكم التاجر: <span id="currentStoreName" style="color: var(--accent-color);"></span></h3>
            
            <form onsubmit="addNewProduct(event)" style="margin-top: 15px;">
                <div class="form-group">
                    <label>اسم المنتج:</label>
                    <input type="text" id="newTitle" required placeholder="مثال: قميص صيفي فاخر">
                </div>
                <div class="form-group">
                    <label>السعر (دج):</label>
                    <input type="number" id="newPrice" required placeholder="3000">
                </div>
                <div class="form-group">
                    <label>رابط الصورة (URL):</label>
                    <input type="url" id="newImg" required placeholder="رابط صورة المنتج">
                </div>
                <button type="submit" class="submit-btn" style="background-color: var(--primary-color);">➕ إضافة المنتج للمتجر العام</button>
            </form>

            <hr style="margin: 20px 0; border-color: #334155;">
            <h4>إدارة منتجاتك:</h4>
            <div id="adminProductsList" style="margin-top: 10px; max-height: 180px; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        // قاعدة البيانات المحلية عبر localStorage
        let vendors = JSON.parse(localStorage.getItem('abdo_vendors')) || []; // {username, password, phone, storeName}
        let products = JSON.parse(localStorage.getItem('abdo_products')) || [
            { id: 1, title: "قميص شبابي عصري", price: 2800, img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400&auto=format&fit=crop&q=80", owner: "الإدارة العامة", phone: "213600000000" },
            { id: 2, title: "سترة شتوية أنيقة", price: 5500, img: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400&auto=format&fit=crop&q=80", owner: "الإدارة العامة", phone: "213600000000" }
        ];
        
        let currentVendor = JSON.parse(localStorage.getItem('abdo_current_vendor')) || null;
        let cart = [];

        const wilayas = [
            "01 - أدرار", "02 - الشلف", "03 - الأغواط", "04 - أم البواقي", "05 - باتنة",
            "06 - بجاية", "07 - بسكرة", "08 - بشار", "09 - البليدة", "10 - البويرة",
            "11 - تمنراست", "12 - تبسة", "13 - تلمسان", "14 - تيارت", "15 - تيزي وزو",
            "16 - الجزائر", "17 - الجلفة", "18 - جيجل", "19 - سطيف", "20 - سعيدة",
            "21 - سكيكدة", "22 - سيدي بلعباس", "23 - عنابة", "24 - قالمة", "25 - قسنطينة",
            "26 - المدية", "27 - مستغانم", "28 - المسيلة", "29 - معسكر", "30 - ورقلة",
            "31 - وهران", "32 - البيض", "33 - إليزي", "34 - برج بوعريريج", "35 - بومرداس",
            "36 - الطارف", "37 - تندوف", "38 - تسمسيلت", "39 - الوادي", "40 - خنشلة",
            "41 - سوق أهراس", "42 - تيبازة", "43 - ميلة", "44 - عين الدفلى", "45 - النعامة",
            "46 - عين تموشنت", "47 - غرداية", "48 - غليزان", "49 - التيميمون", "50 - برج باجي مختار",
            "51 - أولاد جلال", "52 - بني عباس", "53 - إن صالح", "54 - إن قزام", "55 - تقرت",
            "56 - المغير", "57 - المنيعة", "58 - الدبداب"
        ];

        function initApp() {
            renderNavbar();
            renderProducts();
            renderWilayas();
            updateCartUI();
        }

        function renderNavbar() {
            const container = document.getElementById('navBtnsContainer');
            if (currentVendor) {
                container.innerHTML = `
                    <button class="btn btn-admin" onclick="openAdmin()">⚙️ لوحة تحكمي</button>
                    <button class="btn btn-logout" onclick="logoutVendor()">خروج</button>
                    <button class="btn" onclick="openModal('cartModal')">🛒 السلة <span class="cart-badge" id="cartCount">0</span></button>
                `;
            } else {
                container.innerHTML = `
                    <button class="btn btn-admin" onclick="openModal('authModal')">🔐 دخول التجار</button>
                    <button class="btn" onclick="openModal('cartModal')">🛒 السلة <span class="cart-badge" id="cartCount">0</span></button>
                `;
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            if (products.length === 0) {
                grid.innerHTML = "<p style='color: #94a3b8;'>لا توجد منتجات معروضة حالياً.</p>";
                return;
            }
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.title}" class="product-img">
                    <div class="product-info">
                        <div class="product-title">${p.title}</div>
                        <div class="store-owner-tag">المتجر: ${p.owner}</div>
                        <div class="product-price">${p.price} دج</div>
                        <button class="add-to-cart-btn" onclick="addToCart(${p.id})">إضافة إلى السلة 🛒</button>
                    </div>
                </div>
            `).join('');
            if (currentVendor) renderAdminProducts();
        }

        function renderWilayas() {
            const select = document.getElementById('custWilaya');
            select.innerHTML = '<option value="">اختر الولاية...</option>';
            wilayas.forEach(w => {
                const opt = document.createElement('option');
                opt.value = w;
                opt.textContent = w;
                select.appendChild(opt);
            });
        }

        // تسجيل حساب تاجر جديد
        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUser').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPass').value;

            if (vendors.some(v => v.username === username)) {
                alert("اسم المستخدم مستخدم مسبقاً، اختر اسمًا آخر!");
                return;
            }

            const newVendor = { username, phone, password };
            vendors.push(newVendor);
            localStorage.setItem('abdo_vendors', JSON.stringify(vendors));
            
            currentVendor = newVendor;
            localStorage.setItem('abdo_current_vendor', JSON.stringify(currentVendor));

            alert("تم إنشاء الحساب وتسجيل الدخول بنجاح!");
            closeModal('authModal');
            initApp();
        }

        // تسجيل دخول التاجر
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value;

            const vendor = vendors.find(v => v.username === username && v.password === password);
            if (vendor) {
                currentVendor = vendor;
                localStorage.setItem('abdo_current_vendor', JSON.stringify(currentVendor));
                alert("مرحباً بك مجدداً يا " + vendor.username);
                closeModal('authModal');
                initApp();
            } else {
                alert("خطأ في اسم المستخدم أو كلمة المرور!");
            }
        }

        function logoutVendor() {
            currentVendor = null;
            localStorage.removeItem('abdo_current_vendor');
            initApp();
            alert("تم تسجيل الخروج بنجاح.");
        }

        function toggleAuthMode() {
            const loginSec = document.getElementById('loginSection');
            const regSec = document.getElementById('registerSection');
            if (loginSec.style.display === 'none') {
                loginSec.style.display = 'block';
                regSec.style.display = 'none';
            } else {
                loginSec.style.display = 'none';
                regSec.style.display = 'block';
            }
        }

        // إضافة منتج خاص بالتاجر الحالي
        function addNewProduct(e) {
            e.preventDefault();
            if (!currentVendor) return;

            const title = document.getElementById('newTitle').value;
            const price = Number(document.getElementById('newPrice').value);
            const img = document.getElementById('newImg').value;

            const newProd = {
                id: Date.now(),
                title,
                price,
                img,
                owner: currentVendor.username,
                phone: currentVendor.phone
            };

            products.push(newProd);
            localStorage.setItem('abdo_products', JSON.stringify(products));

            renderProducts();
            document.getElementById('newTitle').value = '';
            document.getElementById('newPrice').value = '';
            document.getElementById('newImg').value = '';
            alert("تم إضافة المنتج بنجاح وظهوره في المتجر العام!");
        }

        function renderAdminProducts() {
            const list = document.getElementById('adminProductsList');
            const myProducts = products.filter(p => p.owner === currentVendor.username);
            
            if (myProducts.length === 0) {
                list.innerHTML = "<p style='color: #94a3b8;'>ليس لديك منتجات مضافة بعد.</p>";
                return;
            }

            list.innerHTML = myProducts.map(p => `
                <div class="admin-item">
                    <span>${p.title} (${p.price} دج)</span>
                    <button class="delete-btn" onclick="deleteProduct(${p.id})">حذف</button>
                </div>
            `).join('');
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('abdo_products', JSON.stringify(products));
            renderProducts();
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').textContent = cart.length;
            const list = document.getElementById('cartItemsList');
            if (cart.length === 0) {
                list.innerHTML = "<p style='color: #94a3b8;'>السلة فارغة حالياً.</p>";
            } else {
                list.innerHTML = cart.map((item, index) => `
                    <div class="cart-item">
                        <span>${item.title} <small style="color:var(--accent-color);">(${item.owner})</small></span>
                        <span><b>${item.price} دج</b> <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#ef4444; cursor:pointer; margin-right:8px;">❌</button></span>
                    </div>
                `).join('');
            }
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('totalPrice').textContent = total;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openAdmin() {
            document.getElementById('currentStoreName').textContent = currentVendor.username;
            openModal('adminModal');
            renderAdminProducts();
        }

        // إرسال الطلب عبر الواتساب (يرسل لرقم التاحر أو الإدارة)
        function sendOrder(e) {
            e.preventDefault();
            if (cart.length === 0) {
                alert("برجاء إضافة منتجات إلى السلة أولاً!");
                return;
            }

            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const wilaya = document.getElementById('custWilaya').value;
            const address = document.getElementById('custAddress').value;
            const total = cart.reduce((sum, item) => sum + item.price, 0);

            // سنأخذ رقم الهاتف من أول منتج في السلة أو الرقم الافتراضي
            const targetPhone = cart[0].phone || "213600000000";

            let itemsText = cart.map(i => `- ${i.title} (${i.price} دج) [بواسطة: ${i.owner}]`).join('%0A');

            let message = `🛒 *طلب جديد عبر متجرنا*%0A%0A` +
                          `👤 *الاسم:* ${name}%0A` +
                          `📞 *الهاتف:* ${phone}%0A` +
                          `📍 *الولاية:* ${wilaya}%0A` +
                          `🏡 *العنوان:* ${address}%0A%0A` +
                          `📦 *المنتجات:*%0A${itemsText}%0A%0A` +
                          `💰 *الإجمالي:* ${total} دج`;

            window.open(`https://wa.me/${targetPhone}?text=${message}`, '_blank');
        }

        initApp();
    </script>
</body>
</html>
