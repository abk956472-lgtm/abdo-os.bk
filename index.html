<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Abdo OS Pro</title>
    <style>
        body { margin: 0; background: url('https://w.wallhaven.cc/full/y8/wallhaven-y8j5z9.jpg') no-repeat center center fixed; background-size: cover; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .clock { font-size: 3em; margin-bottom: 20px; text-shadow: 2px 2px 10px #000; }
        .drawer { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; background: rgba(0,0,0,0.5); border-radius: 20px; }
        .app-item { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.3s; }
        .app-item:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
        input { padding: 10px; border-radius: 5px; border: none; margin: 10px; }
    </style>
</head>
<body>

    <div id="lockScreen">
        <h2>🔒 قفل النظام</h2>
        <input type="password" id="pass" placeholder="كلمة المرور: 123">
        <button onclick="checkPass()">دخول</button>
    </div>

    <div id="main" style="display:none; text-align:center;">
        <div class="clock" id="clock">00:00</div>
        <div id="date">--/--/----</div>
        <button onclick="startAI()" style="margin:20px; padding:10px; background:#ff0055; border:none; color:white; border-radius:10px;">🎙️ المساعد الذكي</button>
        <p id="status">اضغط للتحدث...</p>

        <div class="drawer">
            <div class="app-item" onclick="window.open('https://google.com')">🌐 جوجل</div>
            <div class="app-item" onclick="window.open('https://youtube.com')">▶️ يوتيوب</div>
            <div class="app-item" onclick="window.open('https://facebook.com')">👤 فيسبوك</div>
            <div class="app-item" onclick="window.open('https://github.com')">💻 جيت هاب</div>
            <div class="app-item" onclick="window.open('https://chatgpt.com')">🤖 ChatGPT</div>
            <div class="app-item" onclick="alert('ملفاتي...')">📁 ملفاتي</div>
            <div class="app-item" onclick="alert('الإعدادات...')">⚙️ إعدادات</div>
            <div class="app-item" onclick="window.location.reload()">🔄 تحديث</div>
            <div class="app-item" onclick="window.open('https://wikipedia.org')">📖 ويكيبيديا</div>
            <div class="app-item" onclick="alert('قريباً...')">🎮 ألعاب</div>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('ar-EG');
            document.getElementById('date').innerText = now.toLocaleDateString('ar-EG');
        }
        setInterval(updateTime, 1000);

        function checkPass() {
            if(document.getElementById('pass').value == "123") {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('main').style.display = 'block';
            } else { alert("خطأ!"); }
        }

        function startAI() {
            const status = document.getElementById('status');
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'ar-DZ';
            recognition.start();
            status.innerText = "أسمعك يا عبده...";
            recognition.onresult = (e) => {
                const cmd = e.results[0][0].transcript.toLowerCase();
                if(cmd.includes('افتح جوجل')) { window.open('https://google.com'); }
                else if(cmd.includes('يوتيوب')) { window.open('https://youtube.com'); }
                status.innerText = "أنت قلت: " + cmd;
            };
        }
    </script>
</body>
</html>
