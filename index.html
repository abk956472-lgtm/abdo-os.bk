<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر Abdo Store الإلكتروني</title>
    <!-- ربط ملف الـ CSS المنظم -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header>
        <div class="logo">Abdo Store 🛒</div>
        <div class="nav-btns">
            <button class="btn" onclick="openModal('cartModal')">السلة <span class="cart-badge" id="cartCount">0</span></button>
        </div>
    </header>

    <!-- المحتوى الرئيسي للمتجر -->
    <div class="container">
        <h2 class="section-title">المنتجات المتوفرة</h2>
        <div class="products-grid" id="productsGrid">
            <!-- سيتم تعبئة المنتجات تلقائياً عبر JavaScript -->
        </div>
    </div>

    <!-- نافذة سلة التسوق وإتمام الطلب -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('cartModal')">&times;</span>
            <h3 style="margin-bottom: 15px;">سلة المشتريات 🛍️</h3>
            <div id="cartItemsList"></div>
            <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
            <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 15px;">
                الإجمالي الكلي: <span id="totalPrice" style="color: var(--accent-color);">0</span> دج
            </div>

            <!-- نموذج بيانات المشتري -->
            <form id="checkoutForm">
                <h4 style="margin-bottom: 10px; color: var(--primary-color);">معلومات التوصيل</h4>
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="custName" required placeholder="أدخل اسمك الكامل">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="custPhone" required placeholder="06XXXXXXXX">
                </div>
                <div class="form-group">
                    <label>الولاية</label>
                    <select id="custWilaya" required></select>
                </div>
                <div class="form-group">
                    <label>العنوان بالتفصيل</label>
                    <input type="text" id="custAddress" required placeholder="الحي، الشارع، رقم المنزل">
                </div>
                <button type="submit" class="submit-btn">إرسال الطلب عبر الواتساب 📲</button>
            </form>
        </div>
    </div>

    <!-- نافذة تسجيل دخول/تسجيل حساب للتاجر -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('authModal')">&times;</span>
            
            <!-- نموذج تسجيل الدخول -->
            <div id="loginBox">
                <h3 style="margin-bottom: 15px;">تسجيل دخول التاجر 🔐</h3>
                <form id="loginForm">
                    <div class="form-group">
                        <label>اسم المستخدم</label>
                        <input type="text" id="loginUser" required>
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <input type="password" id="loginPass" required>
                    </div>
                    <button type="submit" class="submit-btn">دخول</button>
                </form>
                <div class="switch-auth" onclick="toggleAuthMode()">ليس لديك حساب؟ <span>سجل هنا كتاجر جديد</span></div>
            </div>

            <!-- نموذج إنشاء حساب تاجر جديد -->
            <div id="registerBox" style="display: none;">
                <h3 style="margin-bottom: 15px;">إنشاء حساب تاجر جديد 📝</h3>
                <form id="registerForm">
                    <div class="form-group">
                        <label>اسم المتجر / المستخدم</label>
                        <input type="text" id="regUser" required>
                    </div>
                    <div class="form-group">
                        <label>رقم هاتف المتجر (لاستقبال الطلبات)</label>
                        <input type="tel" id="regPhone" required placeholder="213600000000">
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <input type="password" id="regPass" required>
                    </div>
                    <button type="submit" class="submit-btn" style="background-color: var(--primary-color);">تسجيل حساب</button>
                </form>
                <div class="switch-auth" onclick="toggleAuthMode()">لديك حساب بالفعل؟ <span>سجل دخولك هنا</span></div>
            </div>
        </div>
    </div>

    <!-- لوحة تحكم التاجر لإضافة المنتجات -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('adminModal')">&times;</span>
            <h3 style="margin-bottom: 15px;">لوحة تحكم التاجر 📊</h3>
            
            <form id="addProductForm">
                <h4 style="color: var(--primary-color); margin-bottom: 5px;">إضافة منتج جديد</h4>
                <div class="form-group">
                    <label>عنوان المنتج</label>
                    <input type="text" id="newTitle" required placeholder="مثال: حذاء رياضي أنيق">
                </div>
                <div class="form-group">
                    <label>السعر (دج)</label>
                    <input type="number" id="newPrice" required placeholder="3500">
                </div>
                <div class="form-group">
                    <label>رابط صورة المنتج (URL)</label>
                    <input type="url" id="newImg" required placeholder="https://...">
                </div>
                <button type="submit" class="submit-btn">نشر المنتج في المتجر 🚀</button>
            </form>

            <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
            <h4 style="margin-bottom: 10px;">منتجاتي المعروضة</h4>
            <div id="adminProductsList"></div>
        </div>
    </div>

    <!-- ربط ملفات الـ JavaScript المنظمة (تأكد من مساراتها إذا كانت داخل مجلد js أو دمجتها) -->
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
