    <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Abdo OS Pro</title>
    <style>
        body { margin: 0; background: url('https://w.wallhaven.cc/full/y8/wallhaven-y8j5z9.jpg') center/cover fixed; font-family: sans-serif; overflow: hidden; }
        .window { position: absolute; width: 300px; height: 250px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px #000; display: none; }
        .bar { background: #333; color: white; padding: 5px; cursor: move; display: flex; justify-content: space-between; }
        .taskbar { position: fixed; bottom: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.8); color: white; display: flex; align-items: center; padding: 0 10px; }
        .menu { position: fixed; bottom: 50px; left: 0; width: 200px; background: #222; display: none; padding: 10px; color: white; }
        .app-icon { padding: 10px; cursor: pointer; border-bottom: 1px solid #444; }
    </style>
</head>
<body>

    <div id="lock" style="position:fixed; width:100%; height:100%; background:#000; z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white;">
        <h2>🔐 نظام عبده</h2>
        <input type="password" id="p" placeholder="كلمة المرور: 123">
        <button onclick="check()">دخول</button>
    </div>

    <div id="win1" class="window">
        <div class="bar" onmousedown="drag(this.parentElement)">التطبيق <span>X</span></div>
        <div id="app-content" style="padding:10px;"></div>
    </div>

    <div class="taskbar">
        <div onclick="toggleMenu()" style="cursor:pointer; background:#00d4ff; padding:10px;">ابدأ</div>
        <div id="clock" style="margin-right:20px;"></div>
    </div>

    <div id="menu" class="menu">
        <div class="app-icon" onclick="openApp('calc')">🧮 آلة حاسبة</div>
        <div class="app-icon" onclick="openApp('note')">📝 مفكرة</div>
        <div class="app-icon" onclick="openApp('browser')">🌐 متصفح</div>
        <div class="app-icon" onclick="openApp('ai')">🤖 المساعد</div>
    </div>

    <script>
        function check() { if(document.getElementById('p').value == '123') document.getElementById('lock').style.display='none'; }
        function toggleMenu() { document.getElementById('menu').style.display = (document.getElementById('menu').style.display == 'block' ? 'none' : 'block'); }
        
        function openApp(app) {
            const win = document.getElementById('win1');
            const cont = document.getElementById('app-content');
            win.style.display = 'block';
            if(app == 'calc') cont.innerHTML = "0 + 0 = 0";
            if(app == 'note') cont.innerHTML = "<textarea></textarea>";
            if(app == 'browser') cont.innerHTML = "<input value='https://google.com'>";
            if(app == 'ai') cont.innerHTML = "أنا المساعد الذكي...";
            toggleMenu();
        }

        function drag(elm) {
            elm.onmousedown = (e) => {
                document.onmousemove = (e) => { elm.style.left = e.pageX + 'px'; elm.style.top = e.pageY + 'px'; };
                document.onmouseup = () => { document.onmousemove = null; };
            };
        }

        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
    </script>
</body>
</html>
