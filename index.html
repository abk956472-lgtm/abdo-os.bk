<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdo OS Pro - متجر السوق</title>
    <!-- تحديث مكتبة Supabase إلى أحدث إصدار لدعم المفاتيح الجديدة -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- رأس الصفحة -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">Abdo OS Market</h1>
        <div id="auth-container" class="flex gap-2">
            <!-- سيتم تعبئته برمجياً حسب حالة الدخول -->
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 p-4 max-w-6xl mx-auto w-full">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-semibold">المنتجات المتاحة</h2>
            <div id="seller-actions"></div>
        </div>

        <!-- شبكة عرض المنتجات -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- المنتجات ستظهر هنا -->
        </div>
    </main>

    <!-- نافذة المصادقة (مودال تسجيل الدخول / إنشاء حساب) -->
    <div id="auth-modal" class="fixed inset-0 bg-black/70 hidden justify-center items-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-full max-w-md relative">
            <button onclick="toggleAuthModal(false)" class="absolute top-4 left-4 text-slate-400 hover:text-white">&times;</button>
            <h3 class="text-xl font-bold mb-4 text-center">حساب المستخدم 🔒</h3>
            
            <div class="flex mb-4 bg-slate-950 p-1 rounded-lg">
                <button onclick="switchAuthTab('signup')" id="tab-signup" class="flex-1 py-2 text-center rounded-md bg-blue-600 text-white font-medium transition">إنشاء حساب</button>
                <button onclick="switchAuthTab('signin')" id="tab-signin" class="flex-1 py-2 text-center rounded-md text-slate-400 font-medium transition">تسجيل الدخول</button>
            </div>

            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="auth-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">كلمة المرور</label>
                    <input type="password" id="auth-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div id="role-selector-container">
                    <label class="block text-sm text-slate-400 mb-1">نوع الحساب</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="role" value="customer" checked> 👤 عميل</label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="role" value="seller"> 🏪 بائع</label>
                    </div>
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">إنشاء حساب</button>
            </form>
        </div>
    </div>

    <!-- جافاسكريبت التطبيق -->
    <script>
        // إعدادات الاتصال بـ Supabase مع استخدام المفتاح الجديد الصحيح
        const SUPABASE_URL = "https://lvthnzfubbrhyfnwqaxs.supabase.co";
        const SUPABASE_KEY = "sb_publishable_dxFosZXqkQfgc0qexLu0jw_FJ8xLY_G";
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let authMode = 'signup'; // 'signup' or 'signin'

        async function initApp() {
            checkUserSession();
            loadProducts();
        }

        // إدارة حالة الجلسة وعرض الأزرار في الهيدر
        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authContainer = document.getElementById('auth-container');
            const sellerActions = document.getElementById('seller-actions');

            if (session) {
                const userRole = session.user.user_metadata?.role || 'customer';
                authContainer.innerHTML = `
                    <span class="text-sm text-slate-300 self-center hidden sm:inline">${session.user.email}</span>
                    <button onclick="handleLogout()" class="bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white px-3 py-1.5 rounded-lg text-sm transition">خروج</button>
                `;

                if (userRole === 'seller') {
                    sellerActions.innerHTML = `<button onclick="openAddProductModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium">+ إضافة منتج</button>`;
                }
            } else {
                authContainer.innerHTML = `
                    <button onclick="toggleAuthModal(true)" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">حسابي</button>
                `;
                sellerActions.innerHTML = '';
            }
        }

        // إظهار أو إخفاء نافذة المصادقة
        function toggleAuthModal(show) {
            const modal = document.getElementById('auth-modal');
            modal.style.display = show ? 'flex' : 'none';
        }

        // التبديل بين تبويب إنشاء حساب وتسجيل الدخول
        function switchAuthTab(mode) {
            authMode = mode;
            const btnSignup = document.getElementById('tab-signup');
            const btnSignin = document.getElementById('tab-signin');
            const submitBtn = document.getElementById('auth-submit-btn');
            const roleContainer = document.getElementById('role-selector-container');

            if (mode === 'signup') {
                btnSignup.className = "flex-1 py-2 text-center rounded-md bg-blue-600 text-white font-medium transition";
                btnSignin.className = "flex-1 py-2 text-center rounded-md text-slate-400 font-medium transition";
                submitBtn.innerText = "إنشاء حساب";
                roleContainer.style.display = "block";
            } else {
                btnSignin.className = "flex-1 py-2 text-center rounded-md bg-blue-600 text-white font-medium transition";
                btnSignup.className = "flex-1 py-2 text-center rounded-md text-slate-400 font-medium transition";
                submitBtn.innerText = "تسجيل الدخول";
                roleContainer.style.display = "none";
            }
        }

        // تنفيذ عملية التسجيل أو الدخول
        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const role = document.querySelector('input[name="role"]:checked').value;

            if (authMode === 'signup') {
                const { data, error } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: { data: { role } }
                });
                if (error) {
                    alert('خطأ في إنشاء الحساب: ' + error.message);
                } else {
                    alert('تم إنشاء الحساب بنجاح!');
                    toggleAuthModal(false);
                    checkUserSession();
                }
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });
                if (error) {
                    alert('خطأ في تسجيل الدخول: ' + error.message);
                } else {
                    alert('مرحباً بك مجدداً!');
                    toggleAuthModal(false);
                    checkUserSession();
                    loadProducts();
                }
            }
        }

        // تسجيل الخروج
        async function handleLogout() {
            await supabaseClient.auth.signOut();
            checkUserSession();
            loadProducts();
        }

        // جلب وعرض المنتجات من جدول market_products
        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '<p class="text-slate-400 col-span-full text-center py-8">جاري تحميل المنتجات...</p>';

            const { data, error } = await supabaseClient
                .from('market_products')
                .select('*');

            if (error) {
                grid.innerHTML = `<p class="text-rose-400 col-span-full text-center py-8">فشل تحميل المنتجات: تأكد من تفعيل سياسات RLS في قاعدة البيانات.</p>`;
                console.error(error);
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = '<p class="text-slate-400 col-span-full text-center py-8">لا توجد منتجات مضافة حالياً.</p>';
                return;
            }

            grid.innerHTML = data.map(product => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-md flex flex-col">
                    <img src="${product.img || 'https://via.placeholder.com/300'}" alt="${product.name || 'منتج'}" class="h-48 w-full object-cover">
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-lg mb-1">${product.name || 'بدون اسم'}</h3>
                            <p class="text-slate-400 text-sm mb-3">${product.description || ''}</p>
                        </div>
                        <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-800">
                            <span class="text-blue-400 font-bold">${product.price || 0} دج</span>
                            <button onclick="orderProduct('${product.name}', '${product.price}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-sm transition">اطلب الآن</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function orderProduct(name, price) {
            alert(`طلب منتج: ${name} بسعر ${price} دج. (يمكن ربطه بواتساب مباشرة)`);
        }

        function openAddProductModal() {
            alert('خاصية إضافة المنتجات للبائعين مفعّلة.');
        }

        // تشغيل التطبيق عند التحميل
        window.onload = initApp;
    </script>
</body>
</html>
