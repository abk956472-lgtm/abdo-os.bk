<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Abdo OS Pro</title>
    <style>
        body { margin: 0; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        input { padding: 15px; border-radius: 10px; border: none; margin: 10px; width: 80%; max-width: 300px; text-align: center; }
        button { padding: 15px 30px; background: #00d4ff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .drawer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; }
        .app-item { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .app-item:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        .icon { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="lockScreen">
        <h2>🔒 قفل النظام</h2>
        <input type="password" id="pass" placeholder="أدخل كلمة المرور: 123">
        <button onclick="checkPass()">دخول</button>
    </div>

    <h1 id="title" style="display:none;">Abdo OS Pro</h1>
    <div class="drawer" id="apps" style="display:none;">
        <div class="app-item" onclick="alert('جاري فتح المساعد...')">
            <div class="icon">🤖</div>
            <div>المساعد</div>
        </div>
        <div class="app-item" onclick="window.location.reload()">
            <div class="icon">🔄</div>
            <div>تحديث</div>
        </div>
    </div>

    <script>
        function checkPass() {
            if(document.getElementById('pass').value == "123") {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('title').style.display = 'block';
                document.getElementById('apps').style.display = 'grid';
            } else {
                alert("كلمة المرور خطأ!");
            }
        }
    </script>
</body>
</html>
