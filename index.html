<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1220">
    <title>Abdo Store | منصة التجارة الإلكترونية متعددة البائعين</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #070b14;
            --bg-soft: #0d1422;
            --card: #111a2b;
            --border: rgba(255,255,255,.09);
            --text: #f8fafc;
            --muted: #94a3b8;
            --shadow: 0 20px 60px rgba(0,0,0,.35);
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: "Tajawal", "Cairo", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        button, input, select { font: inherit; cursor: pointer; }
        a { color: inherit; text-decoration: none; }
        .hidden { display: none !important; }
        .container { width: min(1200px, calc(100% - 30px)); margin: auto; }

        header {
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(18px);
            background: rgba(7,11,20,.85);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            min-height: 74px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }

        .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 20px; }
        .brand-icon {
            width: 42px; height: 42px; display: grid; place-items: center;
            border-radius: 14px; background: linear-gradient(135deg, var(--primary), #7c3aed);
            font-size: 21px;
        }
        .brand small { display: block; color: var(--muted); font-size: 11px; }

        .nav { display: flex; align-items: center; gap: 8px; }
        .btn {
            border: 1px solid var(--border); background: rgba(255,255,255,.04);
            color: var(--text); padding: 10px 15px; border-radius: 12px; transition: .2s; font-weight: 700;
        }
        .btn:hover { background: rgba(255,255,255,.08); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-color: transparent; }
        .btn-danger { background: rgba(239,68,68,.12); color: #fca5a5; border-color: rgba(239,68,68,.2); }

        .hero { padding: 60px 0 30px; }
        .hero-box {
            border: 1px solid var(--border); border-radius: 30px; padding: 40px;
            background: linear-gradient(135deg, rgba(59,130,246,.15), rgba(124,58,237,.1)), var(--card);
            box-shadow: var(--shadow);
        }
        .hero h1 { font-size: clamp(28px, 5vw, 48px); margin-bottom: 12px; }
        .hero p { color: var(--muted); font-size: 16px; margin-bottom: 20px; }

        .store-toolbar { display: grid; grid-template-columns: 1fr 180px; gap: 12px; margin: 25px 0; }
        .input, select {
            width: 100%; border: 1px solid var(--border); outline: none; background: var(--card);
            color: var(--text); border-radius: 13px; padding: 13px 15px;
        }
        .input:focus, select:focus { border-color: rgba(59,130,246,.7); }
        select option { background: var(--card); }

        .products-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }

        .product-card {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: .2s;
        }
        .product-card:hover { transform: translateY(-4px); border-color: rgba(59,130,246,.3); }

        .product-image { height: 210px; background: #0b1220; overflow: hidden; }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }

        .product-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; justify-content: space-between; }
        .product-title { font-size: 16px; font-weight: 800; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .price { color: #34d399; font-size: 18px; font-weight: 900; }

        .btn-whatsapp-order {
            width: 100%; padding: 10px; border-radius: 11px; border: 0; color: white; font-weight: 800;
            background: linear-gradient(135deg, #10b981, #059669); text-align: center; display: block;
        }

        .modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: 15px; background: rgba(0,0,0,.75); backdrop-filter: blur(5px); }
        .modal.show { display: flex; }
        .modal-box { width: min(500px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 24px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .close { background: none; border: 0; color: white; font-size: 20px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
        .auth-switch { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-soft); border-radius: 12px; padding: 4px; margin-bottom: 15px; }
        .auth-switch button { border: 0; padding: 8px; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 700; }
        .auth-switch button.active { background: var(--primary); color: white; }

        .toast-container { position: fixed; left: 18px; bottom: 18px; z-index: 3000; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 16px; border-radius: 12px; background: #111827; border: 1px solid var(--border); font-size: 14px; }
        .toast.success { border-right: 4px solid var(--success); }
        .toast.error { border-right: 4px solid var(--danger); }

        @media (max-width: 900px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .products-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <div class="container header-inner">
        <a href="#" class="brand">
            <span class="brand-icon">📦</span>
            <span>Abdo Store <small>متعدد البائعين 🇩🇿</small></span>
        </a>
        <nav class="nav">
            <button class="btn hidden" id="adminBtn">🏪 لوحة البائع</button>
            <button class="btn" id="loginBtn">🔐 الدخول</button>
            <button class="btn btn-danger hidden" id="logoutBtn">خروج</button>
        </nav>
    </div>
</header>

<section class="hero">
    <div class="container">
        <div class="hero-box">
            <h1>مرحباً بك في <span style="color:var(--primary);">Abdo Store</span></h1>
            <p>منصة متكاملة لشراء المنتجات والتواصل مباشرة مع التاجر عبر الواتساب.</p>
        </div>
    </div>
</section>

<main class="container">
    <div class="store-toolbar">
        <input class="input" id="searchInput" type="search" placeholder="ابحث عن منتج...">
        <select id="sortSelect">
            <option value="newest">الأحدث</option>
            <option value="price-low">السعر: من الأقل</option>
        </select>
    </div>

    <div id="productsContainer" class="products-grid">
        <div style="grid-column:1/-1; text-align:center; color:var(--muted); padding:40px;">جاري تحميل المنتجات...</div>
    </div>
</main>

<!-- Auth Modal -->
<div class="modal" id="authModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>الحساب</h3>
            <button class="close" data-close="authModal">×</button>
        </div>
        <div class="auth-switch">
            <button id="loginTab" class="active">دخول</button>
            <button id="signupTab">حساب جديد</button>
        </div>
        <form id="authForm">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input class="input" id="authEmail" type="email" required placeholder="name@email.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input class="input" id="authPassword" type="password" required minlength="6" placeholder="••••••">
            </div>
            <div class="form-group hidden" id="roleGroup">
                <label>نوع الحساب</label>
                <div style="display:flex; gap:15px; margin-top:5px;">
                    <label><input type="radio" name="role" value="customer" checked> عميل</label>
                    <label><input type="radio" name="role" value="vendor"> بائع (تاجر)</label>
                </div>
            </div>
            <!-- حقل الواتساب عند إنشاء الحساب -->
            <div class="form-group hidden" id="whatsappGroup">
                <label>رقم الواتساب الخاص بك (لاستقبال الطلبات)</label>
                <input class="input" id="authWhatsapp" type="text" placeholder="مثال: 0775742738">
            </div>
            
            <button class="btn btn-primary" type="submit" style="width:100%; margin-top:10px;" id="authSubmit">دخول</button>
        </form>
    </div>
</div>

<!-- Admin Modal -->
<div class="modal" id="adminModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>لوحة البائع - إضافة منتج</h3>
            <button class="close" data-close="adminModal">×</button>
        </div>
        <form id="productForm">
            <div class="form-group">
                <label>اسم المنتج</label>
                <input class="input" id="productTitle" required placeholder="مثال: عطر فاخر">
            </div>
            <div class="form-group">
                <label>السعر (دج)</label>
                <input class="input" id="productPrice" type="number" min="1" required placeholder="2500">
            </div>
            <div class="form-group">
                <label>صورة المنتج</label>
                <input class="input" id="productImageFile" type="file" accept="image/*" required>
            </div>
            <button class="btn btn-primary" type="submit" style="width:100%;">نشر المنتج</button>
        </form>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const SUPABASE_URL = "https://lvthnzfubbrhyfnwqaxs.supabase.co";
const SUPABASE_KEY = "sb_publishable_dxFosZXqkQfgc0qexLu0jw_FJ8xLY_G";
const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const state = { products: [], currentUser: null, role: "customer", authMode: "login" };
const $ = sel => document.querySelector(sel);

function toast(msg, type = "success") {
    const d = document.createElement("div");
    d.className = `toast ${type}`;
    d.textContent = msg;
    $("#toastContainer").appendChild(d);
    setTimeout(() => d.remove(), 3500);
}

function showModal(m) { m.classList.add("show"); }
function closeModal(m) { m.classList.remove("show"); }

$("#loginBtn").onclick = () => showModal($("#authModal"));
$("#adminBtn").onclick = () => showModal($("#adminModal"));
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => closeModal(document.getElementById(b.dataset.close)));

$("#loginTab").onclick = () => {
    state.authMode = "login";
    $("#loginTab").classList.add("active");
    $("#signupTab").classList.remove("active");
    $("#roleGroup").classList.add("hidden");
    $("#whatsappGroup").classList.add("hidden");
    $("#authWhatsapp").required = false;
    $("#authSubmit").textContent = "دخول";
};

$("#signupTab").onclick = () => {
    state.authMode = "signup";
    $("#signupTab").classList.add("active");
    $("#loginTab").classList.remove("active");
    $("#roleGroup").classList.remove("hidden");
    
    const isVendor = document.querySelector('input[name="role"]:checked').value === 'vendor';
    if(isVendor) {
        $("#whatsappGroup").classList.remove("hidden");
        $("#authWhatsapp").required = true;
    }
    
    $("#authSubmit").textContent = "إنشاء الحساب";
};

document.querySelectorAll('input[name="role"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
        if (e.target.value === 'vendor' && state.authMode === 'signup') {
            $("#whatsappGroup").classList.remove("hidden");
            $("#authWhatsapp").required = true;
        } else {
            $("#whatsappGroup").classList.add("hidden");
            $("#authWhatsapp").required = false;
        }
    });
});

$("#authForm").onsubmit = async e => {
    e.preventDefault();
    if (!supabaseClient) return toast("خطأ في الاتصال بقاعدة البيانات", "error");
    const email = $("#authEmail").value, password = $("#authPassword").value;
    try {
        if (state.authMode === "login") {
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw error;
            toast("تم تسجيل الدخول بنجاح");
            closeModal($("#authModal"));
        } else {
            const role = document.querySelector('input[name="role"]:checked').value;
            const whatsapp = $("#authWhatsapp").value.trim();
            
            const { error } = await supabaseClient.auth.signUp({ 
                email, 
                password, 
                options: { 
                    data: { 
                        role: role,
                        whatsapp: role === 'vendor' ? whatsapp : null
                    } 
                } 
            });
            if (error) throw error;
            toast("تم إنشاء الحساب بنجاح");
            closeModal($("#authModal"));
        }
        checkSession();
    } catch (err) {
        toast(err.message, "error");
    }
};

async function checkSession() {
    if (!supabaseClient) return;
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
        state.currentUser = session.user;
        state.role = session.user.user_metadata?.role || "customer";
        $("#loginBtn").classList.add("hidden");
        $("#logoutBtn").classList.remove("hidden");
        if (state.role === "vendor") $("#adminBtn").classList.remove("hidden");
    } else {
        state.currentUser = null;
        state.role = "customer";
        $("#loginBtn").classList.remove("hidden");
        $("#logoutBtn").classList.add("hidden");
        $("#adminBtn").classList.add("hidden");
    }
    fetchProducts();
}

$("#logoutBtn").onclick = async () => {
    if (supabaseClient) await supabaseClient.auth.signOut();
    checkSession();
    toast("تم تسجيل الخروج");
};

// جلب المنتجات من جدول market_products المخصص لمتجرك
async function fetchProducts() {
    if (!supabaseClient) return;
    const { data, error } = await supabaseClient.from("market_products").select("*").order("id", { ascending: false });
    if (!error && data) {
        state.products = data;
        renderProducts();
    }
}

function renderProducts() {
    const grid = $("#productsContainer");
    grid.innerHTML = "";
    if (!state.products.length) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--muted); padding:40px;">لا توجد منتجات حالياً</div>`;
        return;
    }
    state.products.forEach(p => {
        const img = p.img || "https://placehold.co/400";
        // دعم عمود whatsapp أو vendor الموجود في جدولك
        const vendorContact = p.whatsapp || p.vendor || "0000000000"; 
        const msg = encodeURIComponent(`السلام عليكم، أريد طلب هذا المنتج: ${p.title} بسعر ${p.price} دج`);
        
        const card = document.createElement("article");
        card.className = "product-card";
        card.innerHTML = `
            <div>
                <div class="product-image"><img src="${img}" alt="${p.title}"></div>
                <div class="product-body">
                    <h3 class="product-title">${p.title}</h3>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="price">${p.price} دج</span>
                    </div>
                    <a href="https://wa.me/213${vendorContact.replace(/^0+/, '')}?text=${msg}" target="_blank" class="btn-whatsapp-order">
                        📱 اطلب عبر واتساب التاجر
                    </a>
                </div>
            </div>
            ${state.role === "vendor" ? `<div style="padding:0 16px 16px;"><button class="btn btn-danger" style="width:100%; padding:6px; font-size:13px;" onclick="deleteProduct('${p.id}')">حذف المنتج</button></div>` : ''}
        `;
        grid.appendChild(card);
    });
}

window.deleteProduct = async function(id) {
    if (!confirm("هل أنت متأكد من حذف المنتج؟")) return;
    const { error } = await supabaseClient.from("market_products").delete().eq("id", id);
    if (error) toast(error.message, "error");
    else { toast("تم الحذف بنجاح"); fetchProducts(); }
};

$("#productForm").onsubmit = async e => {
    e.preventDefault();
    const title = $("#productTitle").value;
    const price = Number($("#productPrice").value);
    const file = $("#productImageFile").files[0];

    const vendorWhatsapp = state.currentUser?.user_metadata?.whatsapp || "0000000000";

    if (!file) return toast("الرجاء اختيار صورة", "error");
    toast("جاري رفع الصورة ونشر المنتج...", "success");

    try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        const { error: uploadError } = await supabaseClient.storage.from('products').upload(`public/${fileName}`, file);
        if (uploadError) throw uploadError;

        const { data: urlData } = supabaseClient.storage.from('products').getPublicUrl(`public/${fileName}`);
        
        // إدخال المنتج في جدول market_products مع حفظ رقم الواتساب تلقائياً
        const { error: insertError } = await supabaseClient.from("market_products").insert([
            { title, price, img: urlData.publicUrl, whatsapp: vendorWhatsapp }
        ]);
        if (insertError) throw insertError;

        toast("تم نشر المنتج بنجاح");
        closeModal($("#adminModal"));
        $("#productForm").reset();
        fetchProducts();
    } catch (err) {
        toast("خطأ: " + err.message, "error");
    }
};

checkSession();
</script>

</body>
</html>
