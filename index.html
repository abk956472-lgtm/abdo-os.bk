<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Abdo OS Pro</title>
    <style>
        body { margin: 0; background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        input { padding: 15px; border-radius: 10px; border: none; margin-bottom: 10px; text-align: center; }
        .drawer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; flex-grow: 1; }
        .app-item { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 20px; border-radius: 25px; text-align: center; cursor: pointer; transition: 0.4s; border: 1px solid rgba(255,255,255,0.1); }
        .app-item:hover { transform: translateY(-10px); background: rgba(61, 220, 132, 0.3); }
        .icon { font-size: 40px; }
    </style>
</head>
<body>

    <div id="lockScreen">
        <h2>🔒 قفل النظام</h2>
        <input type="password" id="pass" placeholder="كلمة المرور: 123">
        <button onclick="checkPass()">دخول</button>
    </div>

    <header style="padding:20px; text-align:center; font-size:24px; color:#3ddc84;">Abdo OS Pro</header>
    <div class="drawer" id="appDrawer"></div>

    <script>
        function checkPass() {
            if(document.getElementById('pass').value == '123') {
                document.getElementById('lockScreen').style.display = 'none';
            } else { alert('كلمة مرور خاطئة!'); }
        }

        const apps = [
            { name: "يوتيوب", icon: "▶️", url: "https://www.youtube.com" },
            { name: "كاميرا", icon: "📷", url: "https://webcamtests.com/" },
            { name: "فيسبوك", icon: "🌐", url: "https://www.facebook.com" },
            { name: "خرائط", icon: "📍", url: "https://maps.google.com" },
            { name: "جوجل", icon: "🔍", url: "https://www.google.com" },
            { name: "موسيقى", icon: "🎵", url: "https://music.youtube.com" }
        ];

        const drawer = document.getElementById('appDrawer');
        apps.forEach(app => {
            drawer.innerHTML += `
                <div class="app-item" onclick="window.open('${app.url}', '_blank')">
                    <div class="icon">${app.icon}</div>
                    <div>${app.name}</div>
                </div>
            `;
        });
    </script>
</body>
</html>
